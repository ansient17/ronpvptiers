<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}
  :root{
    --gold:#f6b327;--bg:#0A0A0A;--card:#0f0f0f;--border:#1e1e1e;
    --muted:#404040;--text:#ffffff;--sub:#7184a7;
  }
  body{background:var(--bg);color:var(--text);padding:16px;}

  .topbar{background:#000;border:1px solid var(--border);border-radius:20px;padding:20px 28px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:52px;font-weight:800;color:var(--gold);letter-spacing:2px;cursor:pointer;}

  .topbar-right{display:flex;align-items:center;gap:14px;position:relative;}
  .discord-btn{background:transparent;border:1px solid var(--border);border-radius:14px;color:#5865F2;font-size:24px;padding:12px 20px;cursor:pointer;transition:.2s;display:flex;align-items:center;}
  .discord-btn:hover{border-color:#5865F2;background:rgba(88,101,242,.08);}
  .settings-btn{background:transparent;border:1px solid var(--border);border-radius:14px;color:var(--sub);font-size:24px;padding:12px 20px;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center;}
  .settings-btn:hover{border-color:var(--gold);color:var(--gold);background:rgba(246,179,39,.08);}
  .settings-btn.active{border-color:var(--gold);color:var(--gold);background:rgba(246,179,39,.08);}

  .discord-dropdown{position:absolute;top:calc(100% + 12px);right:0;background:#0f0f0f;border:1px solid var(--border);border-radius:18px;overflow:hidden;min-width:340px;z-index:200;box-shadow:0 8px 40px rgba(0,0,0,.7);display:none;}
  .discord-dropdown.open{display:block;}
  .discord-item{display:flex;align-items:center;gap:18px;padding:22px 26px;text-decoration:none;color:var(--text);transition:.15s;border-bottom:1px solid var(--border);}
  .discord-item:last-child{border-bottom:none;}
  .discord-item:hover{background:#1a1a1a;}
  .discord-item:hover .discord-item-name{color:#5865F2;}
  .discord-item-icon{width:44px;height:44px;background:#5865F2;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .discord-item-icon svg{width:26px;height:26px;fill:#fff;}
  .discord-item-label{display:flex;flex-direction:column;gap:4px;}
  .discord-item-name{font-size:26px;font-weight:700;transition:.15s;}
  .discord-item-url{font-size:20px;color:var(--sub);font-weight:400;}

  .tabs{display:flex;gap:16px;margin-bottom:20px;flex-wrap:wrap;}
  .tab{width:200px;height:130px;background:#000;border:1px solid var(--border);border-radius:24px;display:flex;flex-direction:column;justify-content:center;align-items:center;cursor:pointer;transition:.2s;}
  .tab:hover{transform:translateY(-4px);border-color:#e8e8e8;}
  .tab.active{border:2px solid var(--gold);box-shadow:0 0 25px rgba(246,179,39,.2);}
  .tab .icon{font-size:40px;margin-bottom:8px;}
  .tab h2{font-size:38px;font-weight:700;}

  .main{display:grid;grid-template-columns:1fr 300px;gap:20px;}
  .board{background:#000;border:1px solid var(--border);border-radius:24px;min-height:680px;overflow:hidden;}
  .headers{display:grid;grid-template-columns:80px 100px 1fr 160px 140px 1fr;padding:26px 32px;color:var(--muted);font-size:30px;font-weight:600;border-bottom:1px solid var(--border);}

  .player-row{display:grid;grid-template-columns:80px 100px 1fr 160px 140px 1fr;padding:12px 32px;border-bottom:1px solid #0d0d0d;align-items:center;transition:.15s;cursor:pointer;}
  .player-row:hover{background:#0d0d0d;}

  .player-row.top1{background:linear-gradient(90deg,rgba(255,215,0,.10) 0%,transparent 60%);border-bottom:1px solid rgba(255,215,0,.12);}
  .player-row.top2{background:linear-gradient(90deg,rgba(192,192,192,.08) 0%,transparent 60%);border-bottom:1px solid rgba(192,192,192,.10);}
  .player-row.top3{background:linear-gradient(90deg,rgba(205,127,50,.08) 0%,transparent 60%);border-bottom:1px solid rgba(205,127,50,.10);}
  .player-row.top1:hover{background:linear-gradient(90deg,rgba(255,215,0,.16) 0%,transparent 60%);}
  .player-row.top2:hover{background:linear-gradient(90deg,rgba(192,192,192,.13) 0%,transparent 60%);}
  .player-row.top3:hover{background:linear-gradient(90deg,rgba(205,127,50,.13) 0%,transparent 60%);}

  .rank{font-size:32px;font-weight:800;color:var(--muted);}
  .rank.r1{color:#FFD700;}
  .rank.r2{color:#C0C0C0;}
  .rank.r3{color:#CD7F32;}

  .skin-chevron{position:relative;width:72px;height:88px;display:flex;align-items:flex-start;justify-content:center;flex-shrink:0;overflow:visible;}
  .skin-chevron::before{content:"";position:absolute;inset:0;clip-path:polygon(0 0,100% 0,100% 78%,50% 100%,0 78%);border-radius:4px 4px 0 0;}
  .skin-chevron.c1::before{background:linear-gradient(160deg,#ffd700,#b8860b);}
  .skin-chevron.c2::before{background:linear-gradient(160deg,#d0d0d0,#808080);}
  .skin-chevron.c3::before{background:linear-gradient(160deg,#cd7f32,#7a4820);}
  .skin-chevron img{position:relative;z-index:1;height:80px;width:auto;margin-top:2px;transform-origin:center bottom;}
  .skin-wrap{width:72px;height:88px;display:flex;align-items:center;justify-content:center;}
  .skin-wrap img{height:72px;width:auto;image-rendering:pixelated;}

  .player-name{font-size:32px;font-weight:700;}
  .region{font-size:26px;color:var(--sub);}
  .points-col{font-size:30px;font-weight:800;color:var(--gold);}
  .tiers{display:flex;gap:10px;flex-wrap:wrap;}
  .tier-badge{font-size:22px;font-weight:700;padding:4px 14px;border-radius:8px;background:#111;}

  .tier-view{display:flex;gap:0;width:100%;}
  .tier-col{flex:1;border-right:1px solid var(--border);min-height:680px;display:flex;flex-direction:column;}
  .tier-col:last-child{border-right:none;}
  .tier-col-header{padding:18px 18px 14px;border-bottom:2px solid var(--border);display:flex;align-items:center;gap:10px;}
  .tier-col-trophy{font-size:30px;flex-shrink:0;}
  .tier-col-title{font-size:32px;font-weight:800;}
  .tier-col-count{font-size:20px;color:var(--sub);font-weight:600;margin-left:auto;}
  .tcol-1{border-top:3px solid #F7C725;}
  .tcol-2{border-top:3px solid #5b58ff;}
  .tcol-3{border-top:3px solid #ff9d47;}
  .tcol-4{border-top:3px solid #e03030;}
  .tcol-5{border-top:3px solid #aaaaaa;}
  .tcol-1 .tier-col-title{color:#F7C725;}
  .tcol-2 .tier-col-title{color:#5b58ff;}
  .tcol-3 .tier-col-title{color:#ff9d47;}
  .tcol-4 .tier-col-title{color:#e03030;}
  .tcol-5 .tier-col-title{color:#aaaaaa;}
  .tcol-1 .tier-col-header{background:rgba(247,199,37,.06);}
  .tcol-2 .tier-col-header{background:rgba(91,88,255,.05);}
  .tcol-3 .tier-col-header{background:rgba(255,157,71,.06);}
  .tcol-4 .tier-col-header{background:rgba(224,48,48,.05);}
  .tcol-5 .tier-col-header{background:rgba(170,170,170,.04);}

  .tier-player-item{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid #111;transition:.12s;cursor:pointer;}
  .tier-player-item:hover{background:#0d0d0d;}
  .tier-player-item.is-ht .tier-player-name{color:#ffffff !important;}
  .tier-player-item.is-lt .tier-player-name{color:#7a7a7a !important;}
  .tier-player-item.is-lt{opacity:.85;}
  .tier-player-skin{width:34px;height:46px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .tier-player-skin img{height:46px;width:auto;image-rendering:pixelated;}
  .tier-player-name{font-size:25px;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tier-chevron{display:flex;flex-direction:column;align-items:center;gap:1px;flex-shrink:0;line-height:1;}
  .tier-chevron svg{width:18px;height:10px;display:block;}
  .chev-ht{color:#7a7a7a;}
  .chev-lt{color:#444;}

  .ht1{color:#F7C725;} .lt1{color:#C7A63C;}
  .ht2{color:#5b58ff;} .lt2{color:#7b79e0;}
  .ht3{color:#ff9d47;} .lt3{color:#ffb14a;}
  .ht4{color:#e03030;} .lt4{color:#a02020;}
  .ht5{color:#aaaaaa;} .lt5{color:#606060;}
  
  .empty{height:580px;display:flex;justify-content:center;align-items:center;flex-direction:column;text-align:center;}
  .empty h1{font-size:60px;margin-bottom:14px;}
  .empty p{color:var(--sub);font-size:26px;max-width:560px;line-height:1.5;}
  
  .side{background:#000;border:1px solid var(--border);border-radius:24px;padding:24px;height:fit-content;}
  .side-title{font-size:40px;font-weight:800;margin-bottom:22px;}
  .point{background:#111;border-radius:14px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:24px;}
  .point b{font-weight:800;}

  .settings-overlay{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);background:rgba(0,0,0,.55);}
  .settings-overlay.open{display:flex;}
  .settings-modal{background:#0f0f0f;border:1px solid var(--border);border-radius:28px;padding:50px;width:1200px;max-width:95vw;position:relative;box-shadow:0 24px 80px rgba(0,0,0,.8);}
  .settings-close{position:absolute;top:24px;right:28px;background:transparent;border:1px solid var(--border);border-radius:10px;color:var(--sub);font-size:28px;padding:6px 16px;cursor:pointer;transition:.2s;line-height:1;}
  .settings-close:hover{border-color:#666;color:#fff;}
  
  .admin-panel{background:#000;border:1px solid var(--gold);border-radius:24px;padding:28px;margin-bottom:20px;}
  .admin-panel-title{font-size:34px;font-weight:800;color:var(--gold);margin-bottom:20px;display:flex;align-items:center;gap:12px;}
  .ap-row{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;}
  .ap-field{flex:1;min-width:160px;}
  .ap-field label{display:block;font-size:22px;color:var(--sub);margin-bottom:8px;}
  .ap-field input,select{width:100%;background:#0a0a0a;border:1px solid var(--border);border-radius:12px;padding:14px 18px;color:#fff;font-size:24px;}
  .ap-field input:focus,select:focus{outline:none;border-color:var(--gold);}
  .btn-sm{padding:14px 22px;border-radius:12px;font-size:22px;font-weight:700;cursor:pointer;border:none;transition:.2s;}
  .btn-add{background:var(--gold);color:#000;}
  .btn-add:hover{background:#e0a020;}
  
  .player-edit-row{display:flex;align-items:center;gap:12px;background:#0d0d0d;border-radius:14px;padding:16px 18px;margin-bottom:10px;}
  .pname{font-size:24px;font-weight:700;flex:1;}
  .btn-edit-ico{background:transparent;border:1px solid var(--border);border-radius:10px;color:var(--sub);font-size:22px;padding:8px 16px;cursor:pointer;}
  .btn-edit-ico:hover{border-color:var(--gold);color:var(--gold);}
  .btn-del-ico{background:transparent;border:1px solid #330000;border-radius:10px;color:#ff5555;font-size:22px;padding:8px 16px;cursor:pointer;}
  .btn-del-ico:hover{background:#200000;}
  
  .login-title{font-size:42px;font-weight:800;margin-bottom:10px;}
  .login-sub{color:var(--sub);font-size:26px;margin-bottom:36px;}
  .field{margin-bottom:22px;}
  .field label{display:block;font-size:24px;color:var(--sub);margin-bottom:10px;}
  .field input,select{width:100%;background:#000;border:1px solid var(--border);border-radius:14px;padding:18px 22px;color:#fff;font-size:28px;}
  .field input:focus,select:focus{outline:none;border-color:var(--gold);}
  .btn-row{display:flex;gap:14px;margin-top:30px;}
  .btn{flex:1;padding:22px;border-radius:14px;font-size:26px;font-weight:700;cursor:pointer;border:none;transition:.2s;}
  .btn-primary{background:var(--gold);color:#000;}
  .btn-primary:hover{background:#e0a020;}
  .btn-cancel{background:#1a1a1a;color:var(--sub);border:1px solid var(--border);}
  .btn-cancel:hover{border-color:#666;color:#fff;}
  .err{color:#ff5555;font-size:22px;margin-top:10px;}
  
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:400;display:flex;align-items:center;justify-content:center;display:none;}
  .modal{background:#0f0f0f;border:1px solid var(--border);border-radius:28px;padding:50px;width:700px;max-width:90vw;}
  .modal h2{font-size:42px;font-weight:800;margin-bottom:10px;}
  .modal p{color:var(--sub);font-size:26px;margin-bottom:36px;}

  .profile-overlay{position:fixed;inset:0;z-index:500;display:none;align-items:center;justify-content:center;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);background:rgba(0,0,0,.65);}
  .profile-overlay.open{display:flex;}
  .profile-modal{background:#0f0f0f;border:1px solid var(--border);border-radius:28px;width:860px;max-width:92vw;position:relative;box-shadow:0 28px 80px rgba(0,0,0,.85);overflow:hidden;animation:profileIn .18s ease;}
  @keyframes profileIn{from{transform:scale(.94);opacity:0;}to{transform:scale(1);opacity:1;}}
  .profile-close{position:absolute;top:24px;right:28px;background:#1a1a1a;border:1px solid var(--border);border-radius:50%;color:#888;font-size:26px;width:52px;height:52px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s;line-height:1;z-index:10;}
  .profile-close:hover{border-color:#888;color:#fff;background:#222;}
  .profile-header{display:flex;flex-direction:column;align-items:center;padding:60px 60px 36px;gap:20px;border-bottom:1px solid var(--border);}
  .profile-avatar-wrap{position:relative;width:190px;height:190px;border-radius:50%;border:3px solid var(--gold);overflow:hidden;background:#111;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .profile-avatar-wrap img{height:175px;width:auto;image-rendering:pixelated;}
  .profile-name{font-size:68px;font-weight:800;text-align:center;}
  .profile-region{font-size:26px;color:var(--sub);text-align:center;}
  .profile-namemc{display:inline-flex;align-items:center;gap:10px;background:#111;border:1px solid var(--border);border-radius:12px;padding:8px 20px;font-size:22px;color:var(--sub);cursor:pointer;font-family:inherit;transition:.15s;}
  .profile-namemc:hover{border-color:#888;color:#fff;}
  .profile-body{padding:40px 60px 50px;}
  .profile-section-title{font-size:28px;font-weight:800;color:var(--sub);letter-spacing:1px;text-transform:uppercase;margin-bottom:20px;}
  .profile-position-pill{display:inline-flex;align-items:center;gap:16px;background:linear-gradient(90deg,rgba(246,179,39,.15),rgba(246,179,39,.04));border:1px solid rgba(246,179,39,.3);border-radius:16px;padding:20px 30px;font-size:34px;font-weight:800;width:100%;margin-bottom:36px;}
  .profile-position-num{font-size:48px;font-weight:900;color:var(--gold);}
  .profile-position-label{color:#fff;}
  .profile-position-pts{color:var(--sub);font-size:28px;font-weight:600;margin-left:auto;}
  .profile-tiers-grid{display:flex;flex-wrap:wrap;gap:16px;}
  .profile-tier-item{display:flex;flex-direction:column;align-items:center;gap:8px;background:#111;border:1px solid var(--border);border-radius:16px;padding:16px 22px;min-width:130px;}
  .profile-tier-icon{font-size:32px;}
  .profile-tier-cat{font-size:20px;color:var(--sub);font-weight:600;}
  .profile-tier-val{font-size:28px;font-weight:800;}
  
  .loading{text-align:center;padding:50px;color:var(--sub);font-size:32px;}
</style>
</head>
